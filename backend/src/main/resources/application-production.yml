spring:
  application:
    name: word-search-backend

  # Database Configuration
  datasource:
    # Use a full SPRING_DATASOURCE_URL if provided; otherwise build the JDBC URL from
    # individual DB_HOST/DB_PORT/DB_NAME parts (e.g. the Render Blueprint).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wordsearch}}
    username: ${SPRING_DATASOURCE_USERNAME:wordsearch_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration (for future caching - optional)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:MySecretKeyForWordSearchGameThatIsLongEnoughForHS256Algorithm}
  expiration: 86400000 # 24 hours in milliseconds

# Server Configuration
server:
  # Hosts like Render inject the port via $PORT; default to 8080 elsewhere.
  port: ${PORT:8080}
  # Bind all interfaces so the platform can reach the app from outside the container.
  # Without this the app may bind to localhost only -> Render "No open ports detected".
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.wordsearch: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/wordsearch/application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# Application-specific configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://wordsearch.app}
  ads:
    max-per-hour: 5
    session-duration-minutes: 60
  premium:
    price-usd: 2.99
