spring:
  application:
    name: word-search-backend

  datasource:
    url: jdbc:h2:mem:wordsearch
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: MySecretKeyForWordSearchGameThatIsLongEnoughForHS256Algorithm
  expiration: 86400000 # 24 hours in milliseconds

logging:
  level:
    com.wordsearch: DEBUG
    org.springframework.security: DEBUG
